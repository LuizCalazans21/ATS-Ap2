name: CI GeekStore

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Instalar Google Chrome
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Rodar testes de unidade e integração (sem servidor)
        run: pytest tests/test_unit.py tests/test_integration.py tests/step_defs/ -v

      - name: Iniciar a aplicação em background para testes de API e E2E
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 5

      - name: Rodar TODOS os testes com cobertura mínima de 90%
        run: |
          pytest --cov=. --cov-report=term-missing --cov-fail-under=90 -v \
            --ignore=tests/test_e2e_selenium.py
          pytest tests/test_e2e_selenium.py -v

      - name: Publicar relatório de cobertura (resumo no log)
        if: always()
        run: pytest --cov=. --cov-report=term-missing -q || true